name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate skill structure and references
        run: python3 scripts/check_skill.py
      - name: Build and verify distributable ZIP
        run: python3 scripts/package.py
      - name: Verify existing ZIP and checksum
        run: python3 scripts/package.py --check
